[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overreach-bench"
version = "0.1.0"
description = "Does a tool-using agent stay inside its authority under task pressure? Scored from the tool trace, watched and unwatched."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oğuzhan Balım" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
overreach-bench = "overreach_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overreach_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
